- name: Enable i2c1 and set the speed, and enable shutdown button
  ansible.builtin.blockinfile:
    insertafter: '# Uncomment some or all of these to enable the optional hardware interfaces'
    path: /boot/firmware/config.txt
    block: |
      dtparam=i2c_arm=on,i2c_arm_baudrate=400000
      dtoverlay=gpio-shutdown,gpio_pin=4,active_low=1,gpio_pull=up
  register: boot

- name: Clone UCTRONICS' Github repository for RPI4 LCD display
  ansible.builtin.git:
    repo: https://github.com/UCTRONICS/SKU_RM0004.git
    dest: ~/SKU_RM0004/

- name: Compile RPI4 LCD display executable
  community.general.make:
    chdir: ~/SKU_RM0004/

- name: Add automatic startup of RPI4 LCD display to rc.local
  ansible.builtin.blockinfile:
    insertbefore: 'exit 0'
    path: /etc/rc.local
    block: |
      cd ~/SKU_RM0004/
      make clean
      make
      ./display &
  register: rc

- name: Rebooting node
  ansible.builtin.reboot:
    reboot_timeout: 300
  when: boot.changed or rc.changed
